name: Fetch TTD Campaign Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-ttd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install axios

      - name: Show repo structure (debug)
        run: ls -R

      - name: Fetch Trade Desk Data
        env:
          TTD_USERNAME: ${{ secrets.TTD_USERNAME }}
          TTD_SECRET: ${{ secrets.TTD_SECRET }}
        run: node scripts/fetch_ttd_data.js

      - name: Commit updated metrics
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/ttd_metrics.json
          git diff --cached --quiet || git commit -m "Update TTD metrics"
          git push
